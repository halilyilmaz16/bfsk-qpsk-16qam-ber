<text x="150" y="630" font-size="16" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">×</text>
<path d="M166 490 L188 490" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M166 630 L188 630" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="190" y="462" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="295.0" y="480.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">(2/Ts)∫₀ᵀˢ r·cos dt</text>
<text x="295.0" y="500.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">zI = aI + nI</text>
<rect x="190" y="602" width="210" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="295.0" y="620.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">(2/Ts)∫₀ᵀˢ r·(−sin) dt</text>
<text x="295.0" y="640.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">zQ = aQ + nQ</text>
<path d="M400 490 L438 490" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M400 630 L438 630" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="419" y="478" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">zI</text>
<text x="419" y="644" font-size="13" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">zQ</text>
<rect x="440" y="462" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="535.0" y="480.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">4-PAM slicer → b₁b₂</text>
<text x="535.0" y="500.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">x = √10·zI; cuts −2, 0, +2</text>
<rect x="440" y="602" width="190" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="535.0" y="620.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">4-PAM slicer → b₃b₄</text>
<text x="535.0" y="640.0" font-size="12" font-weight="400" fill="#993C1D" text-anchor="middle" dominant-baseline="central">x = √10·zQ; cuts −2, 0, +2</text>
<path d="M630 490 L650 490 L650 546 L668 546" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M630 630 L650 630 L650 574 L668 574" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="670" y="532" width="56" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="698.0" y="560.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">P/S</text>
<path d="M726 560 L748 560" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="750" y="532" width="110" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="805.0" y="550.0" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">bits_hat</text>
<text x="805.0" y="570.0" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">compare bits</text>
<text x="30" y="750" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Transmitter: k = 4 bits/symbol, Ts = 4Tb.  G (Gray 4-PAM): 00 → −3, 01 → −1, 11 → +1, 10 → +3</text>
<text x="30" y="772" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Receiver: zI = aI + nI, zQ = aQ + nQ  (same correlators as QPSK)</text>
<text x="30" y="794" font-size="13" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Decision: nearest level on each axis.  1st bit = (x &gt; 0),  2nd bit = (|x| &lt; 2)</text>
<text x="30" y="816" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Es = 1 (÷√10, raw mean energy 5 + 5 = 10),  Eb = Es/4</text>
<text x="30" y="838" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Theory: Pb = ¼·[3Q(u) + 2Q(3u) − Q(5u)],  u = √(4Eb/5N0)      code: qam16_adim_adim.m</text>
</svg>
