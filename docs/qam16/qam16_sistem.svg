<text x="548" y="229" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">−aQ·sin</text>
<circle cx="590" cy="155" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text x="590" y="155" font-size="15" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">Σ</text>
