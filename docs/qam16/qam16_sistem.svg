<rect x="790" y="323" width="70" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="825.0" y="345.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">r(t)</text>
<path d="M825 367 L825 400 L60 400 L60 560 L90 560" fill="none" stroke="#444441" stroke-width="1.2"/>
<rect x="20" y="410" width="860" height="310" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="866" y="428" font-size="14" font-weight="500" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">3  Receiver (correlator)</text>
<path d="M90 560 L90 490 L132 490" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M90 560 L90 630 L132 630" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
