<rect x="640" y="127" width="220" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text x="750.0" y="145.0" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">s(t)</text>
<text x="750.0" y="165.0" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">aI cos 2πfct − aQ sin 2πfct</text>
<rect x="20" y="300" width="860" height="90" rx="12" fill="none" stroke="#888780" stroke-width="1" stroke-dasharray="6 4"/>
<text x="34" y="345" font-size="14" font-weight="500" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">2  Channel (AWGN)</text>
<path d="M750 183 L750 325" fill="none" stroke="#444441" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="180" y="345" font-size="13" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">r(t) = s(t) + n(t),   N0 = Eb / 10^(EbN0_dB/10)</text>
<rect x="560" y="323" width="130" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="625.0" y="345.0" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle" dominant-baseline="central">n(t)</text>
