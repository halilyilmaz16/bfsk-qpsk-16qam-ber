<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img" font-family="Helvetica, Arial, sans-serif">
<title>16-QAM receiver</title><desc>16-QAM receiver</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D3D1C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="470" fill="#0d1117" rx="10"/>
<rect x="30" y="172" width="80" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="70.0" y="190.0" font-size="14" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">r(t)</text>
<text x="70.0" y="210.0" font-size="12" font-weight="400" fill="#B4B2A9" text-anchor="middle" dominant-baseline="central">s + n</text>
<path d="M110 200 L130 200 L130 110 L152 110" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M130 200 L130 290 L152 290" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="110" y="40" width="120" height="38" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.8"/>
<text x="170.0" y="59.0" font-size="14" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">cos 2πfct</text>
<path d="M170 78 L170 92" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="110" y="322" width="120" height="38" rx="8" fill="#085041" stroke="#5DCAA5" stroke-width="0.8"/>
<text x="170.0" y="341.0" font-size="14" font-weight="500" fill="#9FE1CB" text-anchor="middle" dominant-baseline="central">−sin 2πfct</text>
<path d="M170 322 L170 308" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<circle cx="170" cy="110" r="16" fill="#444441" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="170" y="110" font-size="16" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">×</text>
<circle cx="170" cy="290" r="16" fill="#444441" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="170" y="290" font-size="16" font-weight="400" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">×</text>
<path d="M186 110 L208 110" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M186 290 L208 290" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="210" y="82" width="190" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.8"/>
<text x="305.0" y="100.0" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">(2/Ts)∫₀ᵀˢ r·cos dt</text>
<text x="305.0" y="120.0" font-size="12" font-weight="400" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">code: real(r)</text>
<rect x="210" y="262" width="190" height="56" rx="8" fill="#3C3489" stroke="#AFA9EC" stroke-width="0.8"/>
<text x="305.0" y="280.0" font-size="14" font-weight="500" fill="#CECBF6" text-anchor="middle" dominant-baseline="central">(2/Ts)∫₀ᵀˢ r·(−sin) dt</text>
<text x="305.0" y="300.0" font-size="12" font-weight="400" fill="#AFA9EC" text-anchor="middle" dominant-baseline="central">code: imag(r)</text>
<path d="M400 110 L438 110" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="419" y="98" font-size="13" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">zI</text>
<rect x="440" y="82" width="150" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="0.8"/>
<text x="515.0" y="100.0" font-size="14" font-weight="500" fill="#F5C4B3" text-anchor="middle" dominant-baseline="central">4-PAM slicer</text>
<text x="515.0" y="120.0" font-size="12" font-weight="400" fill="#F0997B" text-anchor="middle" dominant-baseline="central">x = √10·zI → b₁b₂</text>
<path d="M400 290 L438 290" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="419" y="278" font-size="13" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">zQ</text>
<rect x="440" y="262" width="150" height="56" rx="8" fill="#712B13" stroke="#F0997B" stroke-width="0.8"/>
<text x="515.0" y="280.0" font-size="14" font-weight="500" fill="#F5C4B3" text-anchor="middle" dominant-baseline="central">4-PAM slicer</text>
<text x="515.0" y="300.0" font-size="12" font-weight="400" fill="#F0997B" text-anchor="middle" dominant-baseline="central">x = √10·zQ → b₃b₄</text>
<path d="M590 110 L600 110 L600 186 L610 186" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M590 290 L600 290 L600 214 L610 214" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="612" y="172" width="54" height="56" rx="8" fill="#444441" stroke="#B4B2A9" stroke-width="0.8"/>
<text x="639.0" y="200.0" font-size="14" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">P/S</text>
<path d="M639 228 L639 252" fill="none" stroke="#D3D1C7" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="639" y="266" font-size="13" font-weight="500" fill="#D3D1C7" text-anchor="middle" dominant-baseline="central">bits_hat</text>
<text x="30" y="392" font-size="13" font-weight="400" fill="#D3D1C7" text-anchor="start" dominant-baseline="central">zI = aI + nI,   zQ = aQ + nQ,   √10·aI, √10·aQ ∈ {−3, −1, +1, +3}</text>
<text x="30" y="414" font-size="13" font-weight="400" fill="#B4B2A9" text-anchor="start" dominant-baseline="central">Cuts −2, 0, +2:  1st bit = (x &gt; 0),  2nd bit = (|x| &lt; 2)  code: pam4_slice</text>
<text x="30" y="436" font-size="13" font-weight="400" fill="#B4B2A9" text-anchor="start" dominant-baseline="central">Nearest level on each axis = ML decision (AWGN, equiprobable symbols)</text>
<text x="30" y="458" font-size="13" font-weight="400" fill="#B4B2A9" text-anchor="start" dominant-baseline="central">Pb = ¼·[3Q(u) + 2Q(3u) − Q(5u)],   u = √(4Eb/5N0)</text>
</svg>
