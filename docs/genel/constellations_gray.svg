<text x="372" y="150" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">11</text>
<text x="372" y="210" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">01</text>
<text x="372" y="270" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">00</text>
<text x="372" y="58" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">row: b3b4</text>
<text x="490" y="325" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">column: b1b2 (I = −3, −1, +1, +3)</text>
<circle cx="246" cy="352" r="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="258" y="352" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Example symbols (10 11 00 11 / 1011 0011)</text>
