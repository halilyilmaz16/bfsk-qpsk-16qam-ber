<circle cx="580" cy="150" r="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<circle cx="400" cy="150" r="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="580" y="134" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">1011</text>
<text x="400" y="134" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">0011</text>
<text x="400" y="305" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">00</text>
<text x="460" y="305" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">01</text>
<text x="520" y="305" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">11</text>
<text x="580" y="305" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">10</text>
