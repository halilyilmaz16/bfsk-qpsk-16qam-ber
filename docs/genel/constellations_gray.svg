<svg xmlns="http://www.w3.org/2000/svg" width="680" height="375" viewBox="0 0 680 375" role="img" font-family="Helvetica, Arial, sans-serif">
<title>QPSK and 16-QAM Gray-coded constellations</title><desc>QPSK has four points and 16-QAM has sixteen, with Gray labels. Orange symbols show the example sequence 1011 0011.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="375" fill="#ffffff" rx="10"/>
<text x="170" y="40" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">QPSK (k = 2)</text>
<text x="490" y="40" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">16-QAM (k = 4)</text>
<line x1="50" y1="180" x2="290" y2="180" stroke="#444441" stroke-width="0.8" opacity="0.5"/>
<line x1="170" y1="70" x2="170" y2="290" stroke="#444441" stroke-width="0.8" opacity="0.5"/>
<text x="298" y="180" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">I</text>
<text x="178" y="76" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Q</text>
<circle cx="110" cy="120" r="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="110" y="102" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">10</text>
<circle cx="230" cy="120" r="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="230" y="102" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">00</text>
<circle cx="110" cy="240" r="7" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="110" y="262" font-size="14" font-weight="500" fill="#444441" text-anchor="middle" dominant-baseline="central">11</text>
<circle cx="230" cy="240" r="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="230" y="262" font-size="12" font-weight="400" fill="#444441" text-anchor="middle" dominant-baseline="central">01</text>
<text x="170" y="325" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">b1 → I sign, b2 → Q sign</text>
<line x1="370" y1="180" x2="610" y2="180" stroke="#444441" stroke-width="0.8" opacity="0.5"/>
<line x1="490" y1="70" x2="490" y2="290" stroke="#444441" stroke-width="0.8" opacity="0.5"/>
<text x="618" y="180" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">I</text>
<text x="498" y="76" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Q</text>
<circle cx="400" cy="90" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="400" cy="210" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
