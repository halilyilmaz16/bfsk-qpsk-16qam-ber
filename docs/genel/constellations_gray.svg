<circle cx="460" cy="270" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="520" cy="90" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="520" cy="150" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="520" cy="210" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<circle cx="520" cy="270" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
